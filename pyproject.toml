[build-system]
requires = ["setuptools==69.5.1", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiocare-signal-sample"
version = "0.1.0"
description = "ECG bandpass and Pan-Tompkins sample from CardioCare"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.109.0",
    "numpy==1.26.4",
    "pydantic==2.6.0",
    "scipy==1.11.4",
    "uvicorn==0.27.0",
]

[project.optional-dependencies]
dev = [
    "anyio==4.3.0",
    "httpx==0.26.0",
    "pytest==7.4.3",
    "ruff==0.8.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
